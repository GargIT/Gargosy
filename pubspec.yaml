name: gargosy
description: "A RomM desktop client for Windows, controller-first, in the look of RomM's v2 UI."
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  dio: ^5.4.0
  path: ^1.9.0
  crypto: ^3.0.3
  uuid: ^4.5.1
  intl: ^0.20.2
  gamepads: ^0.1.10+5
  window_manager: ^0.5.2
  win32: ^6.4.0
  ffi: ^2.2.0
  shared_preferences: ^2.2.2
  shared_preferences_platform_interface: ^2.4.1
  path_provider: ^2.1.2
  path_provider_platform_interface: ^2.1.0
  package_info_plus: ^10.2.2
  pub_semver: ^2.1.4
  qr_flutter: ^4.1.0
  cached_network_image: 4.0.6
  file: ^7.0.1
  # Exact: save zips and RomM's content hashes are built with it, so a new
  # release is chosen and tested, never picked up by a pub upgrade.
  archive: 4.5.2
  zstandard: ^1.5.0
  http: ^1.6.0
  file_picker: ^13.3.0
  flutter_svg: ^2.3.0
  flutter_cache_manager: 3.4.6
  flutter_markdown_plus: ^1.0.12
  pdfrx: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.8.1
  build_runner: ^2.4.9
  fake_async: ^1.3.1
  convert: ^3.1.1
  plugin_platform_interface: ^2.1.0
  gamepads_platform_interface: ^0.1.3
  http_mock_adapter: 0.6.1

# gamepads_windows 0.3.2, patched: its stop() read through a null callback
# token on every exit (third_party/gamepads_windows/GARGOSY.md).
dependency_overrides:
  gamepads_windows:
    path: third_party/gamepads_windows

flutter:
  uses-material-design: true
  assets:
    - assets/branding/gargosy_logo.png
    - thirdparty/gamecontrollerdb.txt
    - thirdparty/7zr.exe
