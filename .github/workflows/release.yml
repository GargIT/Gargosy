name: Release

# Push a tag like v0.1.0 (it must match pubspec.yaml's version): the tests
# run, the release zip is built on a clean runner, and a GitHub Release is
# made with the zip and that version's CHANGELOG.md section as its notes.
on:
  push:
    # Previews (v0.2.0-preview) are preview.yml's.
    tags: ['v*', '!v*-*']

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: Tag matches pubspec.yaml
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^\s+]+)').Matches[0].Groups[1].Value
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Tag ${{ github.ref_name }} doesn't match pubspec.yaml's version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV
      - run: flutter pub get
      - run: flutter analyze
      - run: powershell -File tool/build_sigil.ps1
      - run: flutter test
      - run: powershell -File tool/test_updater.ps1
      - run: pwsh tool/make_release.ps1
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          # The lines under "## [<version>]" up to the next heading or link list.
          $lines = Get-Content CHANGELOG.md
          $i = [array]::FindIndex([string[]]$lines, [Predicate[string]]{ param($l) $l -match "^## \[$([regex]::Escape($env:VERSION))\]" })
          if ($i -lt 0) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $notes = for ($j = $i + 1; $j -lt $lines.Count; $j++) {
            if ($lines[$j] -match '^## \[|^\[[^\]]+\]: ') { break }
            $lines[$j]
          }
          ($notes -join "`n").Trim() | Set-Content -Encoding utf8 release_notes.md
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/Gargosy-${{ env.VERSION }}.zip" --title "Gargosy ${{ env.VERSION }}" --notes-file release_notes.md
      # Scoop and winget (#244): their manifests for this release.
      - run: pwsh tool/fill_package_manifests.ps1 -Version $env:VERSION -Zip "dist/Gargosy-$env:VERSION.zip" -Out dist/packages
      - name: Scoop bucket
        shell: pwsh
        env:
          # A token that may push to GargIT/scoop-gargosy.
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true # a failed git call fails the step
          if (-not $env:SCOOP_BUCKET_TOKEN) { Write-Host '::warning::No SCOOP_BUCKET_TOKEN secret: the Scoop bucket was not updated'; exit 0 }
          git clone --depth 1 "https://x-access-token:$($env:SCOOP_BUCKET_TOKEN)@github.com/GargIT/scoop-gargosy.git" bucket-repo
          Copy-Item dist/packages/scoop/gargosy.json bucket-repo/bucket/gargosy.json
          git -C bucket-repo config user.name 'github-actions[bot]'
          git -C bucket-repo config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C bucket-repo add bucket/gargosy.json
          git -C bucket-repo commit -m "gargosy: Update to version $env:VERSION"
          git -C bucket-repo push
      - name: winget
        shell: pwsh
        env:
          # A classic token with public_repo, for wingetcreate's pull request to microsoft/winget-pkgs.
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Host '::warning::No WINGET_TOKEN secret: nothing was sent to winget'; exit 0 }
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # A pinned wingetcreate, checked: it runs with the token.
          Invoke-WebRequest https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe -OutFile wingetcreate.exe
          if ((Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash -ne '24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA') { throw 'wingetcreate.exe isn''t the pinned v1.12.13.0' }
          ./wingetcreate.exe submit --token $env:WINGET_TOKEN --prtitle "New version: GargIT.Gargosy version $env:VERSION" dist/packages/winget
