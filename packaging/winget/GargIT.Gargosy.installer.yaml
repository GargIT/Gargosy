# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
PackageIdentifier: GargIT.Gargosy
PackageVersion: {{VERSION}}
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: Gargosy\Gargosy.exe
    PortableCommandAlias: gargosy
# Gargosy's folder itself on PATH, not a symlink to the exe: it loads the
# DLLs beside it and keeps its data there.
ArchiveBinariesDependOnPath: true
ReleaseDate: {{DATE}}
Installers:
  - Architecture: x64
    InstallerUrl: {{URL}}
    InstallerSha256: {{SHA256}}
ManifestType: installer
ManifestVersion: 1.10.0
